name: jev-effort-router
version: 0.3.0+ocx
manifest_version: 2
api_version: 1
description: Route each user turn to the best model and reasoning effort via TypeSafe Jev's decision endpoint. Routes Ollama:Cloud by default, or any configured OpenAI-compatible provider such as an OpenCodex (ocx) endpoint with provider/model and combo/<id> ids.
author: "AlphaPerseii3000 (ocx fork: nordz0r)"
license: MIT
homepage: https://github.com/nordz0r/jev-effort-router
tags: [routing, models, reasoning, ollama-cloud, ocx, decisions]
# ``provides_middleware`` is not in the host's ``_KNOWN_MANIFEST_FIELDS``, so declaring it emits an
# "unknown manifest field(s) ignored" warning on every load. It is declared anyway, deliberately:
# ``hermes plugins validate`` diffs the manifest against what ``register(ctx)`` actually wires and
# FAILS an entry whose middleware is undeclared ("undeclared middleware registered (not in
# provides_middleware): llm_request"). That failure is the plugin-catalog admission gate, so an
# undeclared middleware means no catalog entry. A benign load-time warning is the cheaper of the two
# evils. The middleware itself stays wired in code — ``ctx.register_middleware("llm_request", ...)``
# in __init__.py. If upstream ever adds the key to the manifest schema, the warning disappears and
# nothing here needs to change.
provides_middleware:
  - llm_request
provides_hooks:
  - on_session_end
  - post_llm_call
provides_tools:
  - jev_effort_router_status
  - jev_effort_router_route
requires_env:
  - name: TYPESAFE_API_KEY
    description: TypeSafe API key for Jev (default backend). With backend openrouter, set OPENROUTER_API_KEY instead (or name any variable via api_key_env).
    url: https://typesafe.ai
    secret: true
config_schema:
  enabled:
    type: bool
    default: true
    label: Routing enabled
    description: Master switch. When off, the plugin registers but never rewrites a request.
  mode:
    type: str
    default: route
    choices: [route, shadow]
    label: Mode
    description: route rewrites the request; shadow asks Jev and writes the decision to the audit log without changing the request.
  backend:
    type: str
    default: typesafe
    choices: [typesafe, openrouter]
    label: Jev backend
    description: typesafe calls https://api.typesafe.ai/v1/systemone; openrouter calls OpenRouter's Decisions API.
  endpoint:
    type: str
    default: null
    label: Decision endpoint
    description: Override the backend's endpoint URL. Empty uses the backend default.
  api_key_env:
    type: str
    default: null
    label: API key variable
    description: Name of the env variable holding the key (read through the profile's secret scope). Empty uses TYPESAFE_API_KEY or OPENROUTER_API_KEY per backend.
  jev_model:
    type: str
    default: null
    label: Jev model
    description: Decision model id. Empty uses jev-1.13.0 (typesafe) or typesafe/jev-1.13 (openrouter).
  confidence_threshold:
    type: float
    default: 0.5
    label: Confidence threshold
    description: Below this, the more capable of Jev's choice and default_model (by grid order) is used; with no default_model the configured model is kept.
  timeout_s:
    type: float
    default: 2.0
    label: Jev timeout (seconds)
    description: Budget for the decision call. Any timeout leaves the request untouched.
  default_model:
    type: str
    default: ''
    label: Fallback model
    description: Grid model used below the confidence threshold, on an unclear answer, and when Jev is unavailable. Empty keeps the configured model.
  default_effort:
    type: str
    default: medium
    choices: [low, medium, high]
    label: Fallback effort
  context_turns:
    type: int
    default: 4
    label: Context turns
    description: How many preceding conversation turns are sent to Jev as recent context.
  route_per_turn:
    type: bool
    default: true
    label: Route every turn
    description: Off routes once per session instead of once per user turn.
  audit_enabled:
    type: bool
    default: true
    label: Audit log
    description: Append one JSONL record per routed turn under the plugin data directory.
  log_skips:
    type: bool
    default: true
    label: Log skipped turns
    description: Record why a turn was left unrouted (non-routed provider, unknown model, and so on).
  include_user_message_in_audit:
    type: bool
    default: false
    label: Include user message in audit
    description: Off keeps the audit free of conversation content. Turn on only for local debugging.
  grid:
    type: list
    default: null
    label: Routing grid override
    description: 'Optional list replacing the built-in grid, least capable first. Each entry is "model-id: description" or a map {id, description, efforts, context}; efforts lists the levels the model accepts (the chosen level is rounded up onto them), context is its window in tokens.'
  routed_providers:
    type: list
    default: null
    label: Routed providers
    description: Hermes provider names whose requests are routed. Unset keeps the default (ollama-cloud); an explicit empty list routes none. The "custom" prefix is ignored, so custom-colon-ocx and ocx are equal.
  routed_base_urls:
    type: list
    default: null
    label: Routed base URLs
    description: Also route requests whose base_url equals one of these or continues it after a slash. A request with no provider name is never routed.
  catalog_check:
    type: bool
    default: true
    label: Ollama catalog check
    description: Refuse a decision naming a model missing from Hermes' Ollama:cloud model cache. Applies to ollama-cloud only; for other providers the grid is the allowlist.
  context_reserve_tokens:
    type: int
    default: 32000
    label: Context reserve (tokens)
    description: A model fits when its declared context exceeds the estimated prompt (chars/4 over messages and tools) plus this reserve.
  long_context_models:
    type: list
    default: null
    label: Long-context models
    description: 'Used, first that fits, when neither the chosen model nor any more capable grid entry fits the prompt. Entries: a grid id, or {id, context, efforts}.'
  unknown_effort:
    type: str
    default: omit
    choices: [omit, keep, pass]
    label: Effort for unknown model families
    description: 'For combo/<id> and unrecognised provider/model ids: omit reasoning_effort (default), keep the request''s value if it is low/medium/high, or pass Jev''s level through.'
